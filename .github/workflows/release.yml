# Builds content-creator and publishes the deployable build as GitHub Release assets.
#
# Trigger : push a tag like v0.1.0
# Output  : content-creator-<version>.tar.gz          the app + prod deps + built UI
#           content-creator-<version>.tar.gz.sha256   its checksum
#           content-creator-<version>.manifest.json   commit, size, sha256
#
# The tarball is self-contained: whatever deploys it does not run npm again.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:      # dry run: builds and packages, publishes nothing

permissions:
  contents: write         # required to create the release

env:
  APP: content-creator

jobs:
  release:
    runs-on: ubuntu-24.04
    # Same Node as the app's runtime, so node_modules and ffmpeg-static match.
    container: node:22-bookworm
    # Container jobs default to `sh`, which has no pipefail and no [[ ]].
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # The checkout belongs to the runner's UID while this container runs as
      # root, so git refuses to read it ("dubious ownership") without this.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ui

      - name: Build UI
        run: npm run build:ui

      - name: Drop dev dependencies
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Package artifact
        run: |
          set -euo pipefail

          # Tag v0.1.0 -> version 0.1.0. On a manual run there is no tag.
          V="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || V="0.0.0-$GITHUB_RUN_NUMBER"

          F="$APP-$V.tar.gz"
          mkdir -p out

          # Every tracked file (code, assets, fonts), plus prod deps and the built UI.
          git ls-files -z | tar --null -T - -czf "out/$F" node_modules public

          cd out
          sha256sum "$F" > "$F.sha256"

          cat > "$F.manifest.json" <<JSON
          {
            "app": "$APP",
            "version": "$V",
            "commit": "$GITHUB_SHA",
            "builtAt": "$(date -u +%FT%TZ)",
            "builder": "node:22-bookworm",
            "size": $(stat -c%s "$F"),
            "sha256": "$(cut -d' ' -f1 "$F.sha256")"
          }
          JSON

          ls -l

      # Container jobs get none of the runner's preinstalled tools, and gh is not
      # in node:22-bookworm. Debian 12 provides it.
      - name: Install GitHub CLI
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/*

      # Tells the dev-ops repo that a new build exists. Skipped until
      # DEVOPS_DISPATCH_TOKEN is set, so this can't break the release today.
      - name: Notify dev-ops
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.DEVOPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DEVOPS_DISPATCH_TOKEN not set; skipping dispatch"
            exit 0
          fi
          gh api "repos/bonshad2026/devops-stage/dispatches" \
            -f event_type=content-creator-release \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}"

      - name: Keep the dry-run build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: content-creator-dry-run
          path: out/
          retention-days: 7
